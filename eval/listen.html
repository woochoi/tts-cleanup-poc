<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬리 잡음 듣기 판정</title>
<style>
  :root {
    --bg: #F2F1EE; --surface: #FFFFFF; --ink: #1B1D21; --muted: #646A73; --line: #DCDAD4;
    --accent: #2E5BD8; --accent-soft: rgba(46, 91, 216, 0.1);
    --bad: #B4361F; --bad-soft: rgba(180, 54, 31, 0.1);
    --good: #24774A; --good-soft: rgba(36, 119, 74, 0.11);
    --warn: #8B5A00; --warn-soft: rgba(212, 150, 30, 0.16);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141518; --surface: #1D1F23; --ink: #E8E9EC; --muted: #9AA0AA; --line: #33363C;
      --accent: #8AA8FF; --accent-soft: rgba(138, 168, 255, 0.14);
      --bad: #FF8A70; --bad-soft: rgba(255, 138, 112, 0.14);
      --good: #6FD39A; --good-soft: rgba(111, 211, 154, 0.13);
      --warn: #F2C063; --warn-soft: rgba(242, 192, 99, 0.13);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .page { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 16px; }
  header { display: grid; gap: 6px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  .lede { margin: 0; color: var(--muted); word-break: keep-all; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
         padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .progress { font-weight: 600; font-variant-numeric: tabular-nums; }
  .meterbar { flex: 1 1 140px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meterbar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .save { font-size: 13px; color: var(--muted); }
  .save[data-s="err"] { color: var(--bad); }
  label.filter { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .card.done { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .id { font: 600 13px var(--mono); color: var(--muted); }
  .kind { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  .text { font-size: 1.05rem; font-weight: 500; flex: 1 1 100%; word-break: keep-all; }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .hint { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
  .hint.flag { border-color: transparent; background: var(--warn-soft); color: var(--warn); }

  .players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .players { grid-template-columns: minmax(0, 1fr); } }
  .player { display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: var(--bg); min-width: 0; }
  .player b { font-size: 13px; }
  .player small { color: var(--muted); font-variant-numeric: tabular-nums; }
  audio { width: 100%; height: 36px; }
  .ab { justify-self: start; }

  .qs { display: grid; gap: 8px; }
  .q { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .q > span { flex: 1 1 260px; font-size: 14px; word-break: keep-all; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 7px 14px; font: 500 13.5px inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"][data-v="Y"] { background: var(--bad-soft); color: var(--bad); }
  .seg button[aria-pressed="true"][data-v="N"] { background: var(--good-soft); color: var(--good); }
  .extra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .extra input { flex: 1 1 220px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 13px; font: 500 13.5px inherit; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.on { border-color: var(--bad); color: var(--bad); }
  .timer { font: 500 13px var(--mono); color: var(--muted); min-width: 4.5em; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .summary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .summary h2 { margin: 0 0 10px; font-size: 1.05rem; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .err { padding: 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>꼬리 잡음 듣기 판정</h1>
    <p class="lede">문장마다 처리 전과 처리 후를 들어 보고 세 가지를 골라 주세요. 고를 때마다 eval/listening.csv에 바로 저장돼요.</p>
  </header>

  <div class="bar">
    <span class="progress" id="prog">0 / 0</span>
    <span class="meterbar"><i id="progBar"></i></span>
    <label class="filter"><input type="checkbox" id="onlyFlag"> 확인 필요한 문장만</label>
    <label class="filter"><input type="checkbox" id="hideDone"> 다 고른 문장 숨기기</label>
    <span class="save" id="save">불러오는 중…</span>
  </div>

  <div id="list" class="qs"></div>

  <section class="summary">
    <h2>지금까지 판정 요약</h2>
    <div id="sum"></div>
  </section>
</div>

<script>
const QS = [
  ["raw_tail_junk", "처리 전: 마지막 단어 뒤에 잡음·웃음·엉뚱한 말이 있나요?", "있음", "없음"],
  ["clean_tail_junk", "처리 후: 그런 소리가 아직 남아 있나요?", "남음", "없음"],
  ["clean_word_cut", "처리 후: 단어가 잘려 나갔나요?", "잘림", "정상"],
];
let rows = [], saveTimer = null, nowPlaying = null;
const $ = (id) => document.getElementById(id);
const num = (v) => (v === "" || v === "None" || v == null ? null : Number(v));

function flagged(r) {
  return num(r.cer_clean) - num(r.cer_raw) > 0.05;
}
function done(r) { return QS.every(([k]) => r[k] === "Y" || r[k] === "N"); }

function save() {
  $("save").textContent = "저장 중…"; $("save").dataset.s = "";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rows) });
      if (!res.ok) throw new Error(res.status);
      $("save").textContent = "저장됨 " + new Date().toLocaleTimeString("ko-KR");
    } catch (e) {
      $("save").textContent = "저장 실패: 서버가 켜져 있는지 확인해 주세요"; $("save").dataset.s = "err";
    }
  }, 250);
  renderMeta();
}

function playOnly(a) {
  if (nowPlaying && nowPlaying !== a) nowPlaying.pause();
  nowPlaying = a;
}

function card(r) {
  const el = document.createElement("article");
  el.className = "card";
  el.dataset.id = r.id;
  const removed = num(r.removed_s), cr = num(r.cer_raw), cc = num(r.cer_clean);
  el.innerHTML = `
    <div class="head">
      <span class="id">${r.id}</span><span class="kind">${r.kind}</span>
      <div class="text"></div>
    </div>
    <div class="hints">
      <span class="hint">잘라낸 길이 ${removed.toFixed(2)}초</span>
      <span class="hint">${num(r.dur_raw_s).toFixed(2)}초 → ${num(r.dur_clean_s).toFixed(2)}초</span>
      <span class="hint ${flagged(r) ? "flag" : ""}">글자 오류율 ${cr.toFixed(2)} → ${cc.toFixed(2)}${flagged(r) ? " · 잘림 확인 필요" : ""}</span>
    </div>
    <div class="players">
      <div class="player"><b>처리 전</b><audio preload="none" controls src="out/${r.id}.raw.wav"></audio></div>
      <div class="player"><b>처리 후</b><audio preload="none" controls src="out/${r.id}.clean.wav"></audio></div>
    </div>
    <button class="btn ab" type="button">처리 전 → 처리 후 이어 듣기</button>
    <div class="qs"></div>
    <div class="extra">
      <button class="btn time" type="button">수작업 시간 재기</button>
      <span class="timer"></span>
      <input type="text" placeholder="메모 (예: 끝에 숨소리 남음)">
    </div>`;
  el.querySelector(".text").textContent = r.text;
  const [aRaw, aClean] = el.querySelectorAll("audio");
  aRaw.addEventListener("play", () => playOnly(aRaw));
  aClean.addEventListener("play", () => playOnly(aClean));
  el.querySelector(".ab").onclick = () => {
    aClean.pause(); aClean.currentTime = 0; aRaw.currentTime = 0;
    aRaw.onended = () => { aRaw.onended = null; setTimeout(() => aClean.play(), 500); };
    aRaw.play();
  };

  const qs = el.querySelector(".qs");
  for (const [key, label, yes, no] of QS) {
    const q = document.createElement("div");
    q.className = "q";
    q.innerHTML = `<span></span><span class="seg"><button type="button" data-v="Y">${yes}</button><button type="button" data-v="N">${no}</button></span>`;
    q.querySelector("span").textContent = label;
    for (const b of q.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(r[key] === b.dataset.v));
      b.onclick = () => {
        r[key] = r[key] === b.dataset.v ? "" : b.dataset.v;
        for (const x of q.querySelectorAll("button")) x.setAttribute("aria-pressed", String(r[key] === x.dataset.v));
        el.classList.toggle("done", done(r));
        save();
      };
    }
    qs.append(q);
  }

  const note = el.querySelector("input");
  note.value = r.note || "";
  note.oninput = () => { r.note = note.value; save(); };

  // Stopwatch for the manual baseline: start, trim the raw file in an audio editor, stop.
  const tBtn = el.querySelector(".time"), tOut = el.querySelector(".timer");
  let t0 = null, tick = null;
  const show = (s) => (tOut.textContent = s == null || s === "" ? "" : `${Number(s).toFixed(1)}초`);
  show(r.manual_edit_s);
  tBtn.onclick = () => {
    if (t0 == null) {
      t0 = performance.now(); tBtn.textContent = "멈추고 기록"; tBtn.classList.add("on");
      tick = setInterval(() => show((performance.now() - t0) / 1000), 100);
    } else {
      clearInterval(tick);
      r.manual_edit_s = ((performance.now() - t0) / 1000).toFixed(1);
      t0 = null; tBtn.textContent = "다시 재기"; tBtn.classList.remove("on");
      show(r.manual_edit_s); save();
    }
  };
  el.classList.toggle("done", done(r));
  return el;
}

function renderMeta() {
  const n = rows.length, d = rows.filter(done).length;
  $("prog").textContent = `${d} / ${n} 문장 판정`;
  $("progBar").style.width = n ? `${(100 * d) / n}%` : "0";
  for (const el of document.querySelectorAll(".card")) {
    const r = rows.find((x) => x.id === el.dataset.id);
    el.hidden = ($("onlyFlag").checked && !flagged(r)) || ($("hideDone").checked && done(r));
  }
  const groups = [["표준어"], ["사투리"], [null, "전체"]];
  const count = (R, k, v) => R.filter((r) => r[k] === v).length;
  let html = "<table><tr><th></th><th>처리 전 꼬리 있음</th><th>처리 후 꼬리 남음</th><th>처리 후 단어 잘림</th><th>판정한 문장</th><th>수작업 평균</th></tr>";
  for (const [kind, name] of groups) {
    const R = rows.filter((r) => kind == null || r.kind === kind);
    const J = R.filter(done);
    const m = R.map((r) => num(r.manual_edit_s)).filter((x) => x != null);
    html += `<tr><td>${name || kind}</td><td>${count(J, "raw_tail_junk", "Y")} / ${J.length}</td><td>${count(J, "clean_tail_junk", "Y")} / ${J.length}</td><td>${count(J, "clean_word_cut", "Y")} / ${J.length}</td><td>${J.length} / ${R.length}</td><td>${m.length ? (m.reduce((a, b) => a + b, 0) / m.length).toFixed(1) + "초 (" + m.length + "개)" : "-"}</td></tr>`;
  }
  $("sum").innerHTML = html + "</table>";
}

async function init() {
  try {
    const data = await (await fetch("/api/data")).json();
    const sheet = Object.fromEntries(data.sheet.map((r) => [r.id, r]));
    rows = data.results.map((r) => ({ ...r, raw_tail_junk: "", clean_tail_junk: "", clean_word_cut: "", manual_edit_s: "", note: "", ...(sheet[r.id] || {}) , ...pick(r) }));
    for (const r of rows) $("list").append(card(r));
    $("save").textContent = "준비됨";
    renderMeta();
  } catch (e) {
    $("list").innerHTML = `<div class="err">결과를 불러오지 못했어요. 터미널에서 python eval/listen_server.py 를 실행한 뒤 http://127.0.0.1:8770/ 으로 열어 주세요.</div>`;
    $("save").textContent = "";
  }
}
// Keep the measured columns from results.csv even if an older sheet row lacks them.
function pick(r) { return { id: r.id, kind: r.kind, text: r.text }; }
$("onlyFlag").onchange = renderMeta;
$("hideDone").onchange = renderMeta;
init();
</script>
</body>
</html>
